<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EFF3FF"/>
    </linearGradient>
    <linearGradient id="brandA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#204EB8"/>
      <stop offset="1" stop-color="#678EE0"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCC33"/>
      <stop offset="1" stop-color="#FFD76B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="520" fill="url(#bgA)"/>

  <!-- Soft top-right ribbon (brand) -->
  <path d="M1100 0 L1600 0 L1600 220 C1450 180 1320 140 1100 160 Z" fill="url(#brandA)" opacity="0.12"/>

  <!-- Accent gold underline sweeping left-to-right -->
  <path d="M0 390 C 280 360, 540 440, 820 410 C 1040 388, 1300 430, 1600 400 L1600 420 C 1300 450, 1040 408, 820 430 C 540 460, 280 380, 0 410 Z"
        fill="url(#goldA)" opacity="0.22"/>

  <!-- Bottom-right waves (brand) -->
  <path d="M860,500 C1080,460 1280,520 1600,480 L1600,520 L860,520 Z" fill="url(#brandA)" opacity="0.14"/>
  <path d="M900,520 C1160,490 1380,520 1600,500 L1600,520 L900,520 Z" fill="url(#brandA)" opacity="0.10"/>

  <!-- Connection nodes and lines (left-mid; subtle) -->
  <g stroke="#204EB8" stroke-width="2" opacity="0.22" fill="none">
    <line x1="160" y1="170" x2="300" y2="170"/>
    <line x1="300" y1="170" x2="360" y2="220"/>
    <circle cx="160" cy="170" r="4" fill="#204EB8"/>
    <circle cx="300" cy="170" r="4" fill="#204EB8"/>
    <circle cx="360" cy="220" r="4" fill="#204EB8"/>

    <line x1="210" y1="250" x2="320" y2="250"/>
    <line x1="320" y1="250" x2="400" y2="300"/>
    <circle cx="210" cy="250" r="4" fill="#204EB8"/>
    <circle cx="320" cy="250" r="4" fill="#204EB8"/>
    <circle cx="400" cy="300" r="4" fill="#204EB8"/>
  </g>

  <!-- Contact pictograms (stroke only) -->
  <g stroke="#204EB8" stroke-width="2" opacity="0.30" fill="none">
    <!-- Envelope -->
    <rect x="1180" y="120" width="96" height="62" rx="10"/>
    <path d="M1180 128 L1228 160 L1276 128"/>
    <!-- Phone -->
    <rect x="1308" y="120" width="58" height="102" rx="12"/>
    <rect x="1326" y="132" width="22" height="4" rx="2"/>
    <circle cx="1337" cy="206" r="4"/>
    <!-- Pin -->
    <path d="M1460 132 C1436 132 1418 150 1418 172 C1418 197 1446 220 1460 236 C1474 220 1502 197 1502 172 C1502 150 1484 132 1460 132 Z"/>
    <circle cx="1460" cy="172" r="10"/>
  </g>

  <!-- Invisible safe area for text (for reference only) -->
  <rect x="360" y="110" width="880" height="260" fill="#ffffff" opacity="0.0"/>
</svg>
