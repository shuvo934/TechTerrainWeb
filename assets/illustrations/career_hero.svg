<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAFF"/>
    <stop offset="1" stop-color="#ECF2FF"/>
  </linearGradient>
  <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#204EB8" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#204EB8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbLight" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#678EE0" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#678EE0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orbGold" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFCC33" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#FFCC33" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#204EB8" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#678EE0" stop-opacity="0.10"/>
  </linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg3)"/>

<!-- subtle grid lines -->
<g stroke="#DDE6FF" stroke-width="1" opacity="0.6">
  <line x1="0" y1="140" x2="1600" y2="140"/>
  <line x1="0" y1="320" x2="1600" y2="320"/>
  <line x1="0" y1="500" x2="1600" y2="500"/>
  <line x1="0" y1="680" x2="1600" y2="680"/>
  <line x1="220" y1="0" x2="220" y2="900"/>
  <line x1="520" y1="0" x2="520" y2="900"/>
  <line x1="980" y1="0" x2="980" y2="900"/>
  <line x1="1320" y1="0" x2="1320" y2="900"/>
</g>

  <!-- network lines -->
  <g stroke="url(#lineBlue)" stroke-width="2" opacity="0.55">
    <line x1="140" y1="180" x2="460" y2="260"/>
    <line x1="460" y1="260" x2="760" y2="200"/>
    <line x1="760" y1="200" x2="1100" y2="300"/>
    <line x1="1100" y1="300" x2="1420" y2="220"/>
    <line x1="280" y1="520" x2="620" y2="440"/>
    <line x1="620" y1="440" x2="980" y2="520"/>
    <line x1="980" y1="520" x2="1320" y2="460"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="140" cy="180" r="6" fill="#204EB8" opacity="0.6"/>
    <circle cx="460" cy="260" r="6" fill="#678EE0" opacity="0.6"/>
    <circle cx="760" cy="200" r="6" fill="#204EB8" opacity="0.6"/>
    <circle cx="1100" cy="300" r="6" fill="#678EE0" opacity="0.6"/>
    <circle cx="1420" cy="220" r="6" fill="#204EB8" opacity="0.6"/>
    <circle cx="280" cy="520" r="6" fill="#678EE0" opacity="0.6"/>
    <circle cx="620" cy="440" r="6" fill="#204EB8" opacity="0.6"/>
    <circle cx="980" cy="520" r="6" fill="#678EE0" opacity="0.6"/>
    <circle cx="1320" cy="460" r="6" fill="#204EB8" opacity="0.6"/>
  </g>

<!-- gradient orbs -->
<circle cx="240" cy="200" r="160" fill="url(#orbBlue)"/>
<circle cx="1380" cy="260" r="140" fill="url(#orbLight)"/>
<circle cx="900" cy="720" r="180" fill="url(#orbGold)"/>

<!-- small pills -->
<rect x="1240" y="120" rx="10" ry="10" width="160" height="12" fill="#204EB8" opacity="0.12"/>
<rect x="1240" y="146" rx="10" ry="10" width="110" height="12" fill="#678EE0" opacity="0.12"/>
</svg>

