<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="680" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="brandBm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#204EB8"/>
      <stop offset="1" stop-color="#678EE0"/>
    </linearGradient>
    <linearGradient id="goldBm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCC33"/>
      <stop offset="1" stop-color="#FFD76B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="url(#bgBm)"/>

  <!-- Diagonal band -->
  <path d="M900 0 L900 680 L540 680 C620 600 780 380 900 220 Z" fill="url(#brandBm)" opacity="0.10"/>

  <!-- Bottom wave -->
  <path d="M0,600 C 200,640 420,580 620,630 C 760,660 850,640 900,650 L900,680 L0,680 Z" fill="url(#brandBm)" opacity="0.12"/>

  <!-- Accent swoosh under copy area -->
  <path d="M70 420 C190 405 340 430 460 415 C520 408 570 412 620 418" stroke="url(#goldBm)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- Nodes -->
  <g stroke="#204EB8" stroke-width="2" opacity="0.22" fill="none">
    <line x1="60" y1="220" x2="160" y2="220"/>
    <line x1="160" y1="220" x2="200" y2="270"/>
    <circle cx="60" cy="220" r="4" fill="#204EB8"/>
    <circle cx="160" cy="220" r="4" fill="#204EB8"/>
    <circle cx="200" cy="270" r="4" fill="#204EB8"/>
  </g>

  <!-- Safe copy area -->
  <rect x="56" y="160" width="660" height="260" fill="#ffffff" opacity="0.0"/>
</svg>
