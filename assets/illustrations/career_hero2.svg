<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#204EB8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#678EE0" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#678EE0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#204EB8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFCC33" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFCC33" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#204EB8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#204EB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#678EE0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#678EE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFCC33" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFCC33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#204EB8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#678EE0" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFCC33"/>
      <stop offset="1" stop-color="#FFD875"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- base waves -->
  <path d="M0,620 C260,560 520,650 800,610 C1080,570 1320,520 1600,560 L1600,900 L0,900 Z" fill="url(#wave1)"/>
  <path d="M0,710 C320,690 600,760 1000,720 C1240,695 1460,680 1600,695 L1600,900 L0,900 Z" fill="url(#wave2)"/>

  <!-- gold accent ribbon -->
  <path d="M0,660 C200,640 420,700 720,680 C1020,660 1220,620 1600,640 L1600,700 C1200,680 1000,720 700,740 C400,760 180,700 0,720 Z" fill="url(#accent)"/>

  <!-- subtle dots cluster -->
  <g opacity="0.25" fill="#C7D5FF">
    <circle cx="120" cy="140" r="2"/><circle cx="150" cy="140" r="2"/><circle cx="180" cy="140" r="2"/>
    <circle cx="120" cy="170" r="2"/><circle cx="150" cy="170" r="2"/><circle cx="180" cy="170" r="2"/>
  </g>

  <!-- network lines -->
  <g stroke="url(#lineBlue)" stroke-width="2" opacity="0.55">
    <line x1="140" y1="180" x2="460" y2="260"/>
    <line x1="460" y1="260" x2="760" y2="200"/>
    <line x1="760" y1="200" x2="1100" y2="300"/>
    <line x1="1100" y1="300" x2="1420" y2="220"/>
    <line x1="280" y1="520" x2="620" y2="440"/>
    <line x1="620" y1="440" x2="980" y2="520"/>
    <line x1="980" y1="520" x2="1320" y2="460"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="140" cy="180" r="6" fill="url(#gold)" opacity="0.7"/>
    <circle cx="460" cy="260" r="6" fill="#678EE0" opacity="0.7"/>
    <circle cx="760" cy="200" r="6" fill="url(#gold)" opacity="0.7"/>
    <circle cx="1100" cy="300" r="6" fill="#678EE0" opacity="0.7"/>
    <circle cx="1420" cy="220" r="6" fill="url(#gold)" opacity="0.7"/>
    <circle cx="280" cy="520" r="6" fill="#678EE0" opacity="0.7"/>
    <circle cx="620" cy="440" r="6" fill="url(#gold)" opacity="0.7"/>
    <circle cx="980" cy="520" r="6" fill="#678EE0" opacity="0.7"/>
    <circle cx="1320" cy="460" r="6" fill="url(#gold)" opacity="0.7"/>
  </g>

  <!-- gradient orbs -->
  <circle cx="240" cy="200" r="160" fill="url(#orbBlue)"/>
  <circle cx="1380" cy="260" r="140" fill="url(#orbLight)"/>
  <circle cx="900" cy="720" r="180" fill="url(#orbGold)"/>

  <!-- tiny pills -->
  <rect x="1240" y="140" rx="10" ry="10" width="180" height="14" fill="#204EB8" opacity="0.12"/>
  <rect x="1240" y="170" rx="10" ry="10" width="120" height="14" fill="#678EE0" opacity="0.12"/>
  <rect x="1240" y="200" rx="10" ry="10" width="150" height="14" fill="#FFCC33" opacity="0.18"/>
</svg>
