<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <linearGradient id="brandBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#204EB8"/>
      <stop offset="1" stop-color="#678EE0"/>
    </linearGradient>
    <linearGradient id="tealToBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#678EE0" />
      <stop offset="1" stop-color="#204EB8" />
    </linearGradient>
    <radialGradient id="orb" cx="70%" cy="25%" r="45%">
      <stop offset="0" stop-color="#678EE0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#678EE0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="24" height="24">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#204EB8" opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feOffset dx="0" dy="8" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="1920" height="1080" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#roundedFrame)">
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    <rect width="1920" height="1080" fill="url(#orb)"/>
    <rect x="1100" y="0" width="860" height="1080" fill="url(#dots)"/>
    <path d="M1920,0 L1920,0 L1920,360 C1500,340 1220,320 970,420 C820,480 700,600 520,650 C380,690 240,680 0,640 L0,0 Z"
          fill="url(#brandBlue)" opacity="0.11"/>
    <path d="M0,900 C260,960 520,980 760,960 C1040,940 1200,840 1440,820 C1680,800 1800,820 1920,860 L1920,1080 L0,1080 Z"
          fill="url(#tealToBlue)" opacity="0.18"/>
    <g filter="url(#soft)">
      <path d="M1700,180 C1770,140 1860,160 1890,220 C1920,280 1880,360 1800,390 C1720,420 1620,380 1600,320 C1580,260 1630,220 1700,180 Z"
            fill="#FFCC33" opacity="0.9"/>
    </g>
    <g opacity="0.85">
      <rect x="1320" y="320" width="180" height="32" rx="16" fill="#204EB8" opacity="0.15"/>
      <rect x="1480" y="380" width="240" height="32" rx="16" fill="#678EE0" opacity="0.15"/>
      <rect x="1400" y="440" width="140" height="32" rx="16" fill="#204EB8" opacity="0.15"/>
    </g>
    <g stroke="#204EB8" stroke-opacity="0.18" stroke-width="2" fill="none">
      <path d="M100,260 L220,320 L360,260 L520,340 L700,280" />
      <path d="M220,320 L260,420 L420,460 L540,420" />
      <path d="M360,260 L420,180 L600,160" />
    </g>
    <g fill="#204EB8" fill-opacity="0.25">
      <circle cx="100" cy="260" r="4"/>
      <circle cx="220" cy="320" r="4"/>
      <circle cx="360" cy="260" r="4"/>
      <circle cx="520" cy="340" r="4"/>
      <circle cx="700" cy="280" r="4"/>
      <circle cx="260" cy="420" r="4"/>
      <circle cx="420" cy="460" r="4"/>
      <circle cx="540" cy="420" r="4"/>
      <circle cx="420" cy="180" r="4"/>
      <circle cx="600" cy="160" r="4"/>
    </g>
    <g opacity="0.25" fill="none" stroke="#204EB8">
      <circle cx="1560" cy="220" r="36" stroke-width="3"/>
      <circle cx="1560" cy="220" r="62" stroke-width="3" opacity="0.6"/>
    </g>
  </g>
</svg>
